name: Construire sPing

on:
  push:
    branches: [main, 'claude/**']
    # La documentation seule ne relance pas la compilation (ni de nouvelle version).
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tools/logo/**'
  pull_request:
  workflow_dispatch:
    inputs:
      publier:
        description: Publier cette compilation comme nouvelle version (Release)
        type: boolean
        default: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.9
  VERSION: 1.0.${{ github.run_number }}

jobs:
  tests:
    name: Analyse et tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Dépendances
        run: flutter pub get
      - name: Analyse statique
        run: flutter analyze
      # Les tests font dialoguer un téléphone et un PC sPing réels sur la machine :
      # appairage, chiffrement, imposteurs, relais, réponses, reconnexion.
      - name: Tests
        run: flutter test

  android:
    name: APK Android
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Dépendances
        run: flutter pub get

      # Facultatif : avec une clé personnelle, les mises à jour s'installent par-dessus
      # l'ancienne version sans avoir à désinstaller (voir README).
      - name: Clé de signature
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'sping' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          {
            echo "storeFile=app/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Compilation de l'APK
        run: |
          flutter build apk --release --build-name=$VERSION --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk sping.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sping-android
          path: sping.apk
          retention-days: 30

  windows:
    name: Application Windows
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SORTIE: build\windows\x64\runner\Release
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Dépendances
        run: flutter pub get
      # Les mêmes tests, sur Windows : c'est là que tourne l'application.
      - name: Tests
        run: flutter test
      - name: Compilation
        run: flutter build windows --release --build-name=${{ env.VERSION }} --build-number=${{ github.run_number }}

      - name: Assemblage
        shell: pwsh
        run: |
          # Bibliothèques d'exécution de Visual C++ : absentes d'un Windows fraîchement installé.
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:SystemRoot\System32\$dll" $env:SORTIE
          }
          Get-ChildItem $env:SORTIE | Format-Table Name, Length

      # L'application compilée se lance, ouvre sa fenêtre et écoute les annonces des
      # téléphones ; une deuxième ouverture ne crée pas de deuxième copie ; fermer la
      # fenêtre la cache dans la zone de notification.
      - name: Essai de démarrage
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "$env:SORTIE\sping.exe" -PassThru
          Start-Sleep -Seconds 15
          $app.Refresh()
          if ($app.HasExited) { throw "sPing s'est arrêté tout seul (code $($app.ExitCode))." }
          if ($app.MainWindowHandle -eq 0) { throw "sPing n'a pas ouvert de fenêtre." }
          Write-Host "Fenêtre ouverte : « $($app.MainWindowTitle) »"

          $ecoute = Get-NetUDPEndpoint -LocalPort 47874 -ErrorAction SilentlyContinue | Where-Object OwningProcess -eq $app.Id
          if (-not $ecoute) { throw "sPing n'écoute pas les annonces des téléphones (UDP 47874)." }
          Write-Host "À l'écoute des téléphones sur le port UDP 47874."

          $second = Start-Process -FilePath "$env:SORTIE\sping.exe" -PassThru
          if (-not $second.WaitForExit(15000)) { $second.Kill(); throw "Une deuxième copie de sPing est restée ouverte." }
          Write-Host "Deuxième ouverture : renvoyée vers la première copie."

          $app.CloseMainWindow() | Out-Null
          Start-Sleep -Seconds 3
          $app.Refresh()
          if ($app.HasExited) {
            # Sans barre des tâches (session de la CI), pas d'icône : fermer quitte sPing.
            Write-Host "Fermeture : sPing s'est arrêté (pas de zone de notification sur cette machine)."
          } else {
            Write-Host "Fermeture : fenêtre cachée, sPing reste dans la zone de notification."
            Stop-Process -Id $app.Id -Force
          }

      - name: Archive portable
        shell: pwsh
        run: Compress-Archive -Path "$env:SORTIE\*" -DestinationPath sping-windows.zip

      - name: Installateur
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc "/DAppVersion=$env:VERSION" tools\installer\sping.iss
          if ($LASTEXITCODE -ne 0) { throw "La création de l'installateur a échoué." }
          Get-Item sping-setup.exe, sping-windows.zip | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: sping-windows
          path: |
            sping-setup.exe
            sping-windows.zip
          retention-days: 30

  # Une nouvelle version est publiée à chaque envoi sur « main », ou à la demande
  # (bouton « Run workflow », case « Publier »). Les liens …/releases/latest/download/…
  # du README pointent toujours vers la dernière.
  publication:
    name: Publication de la version
    needs: [android, windows]
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || inputs.publier)
    runs-on: ubuntu-latest
    permissions:
      contents: write # nécessaire pour publier la Release
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: sPing ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            sping.apk
            sping-setup.exe
            sping-windows.zip
          body: |
            sPing compilé automatiquement (commit ${{ github.sha }}).

            **Sur le téléphone** : téléchargez `sping.apk`, ouvrez-le et autorisez l'installation
            d'applications de sources inconnues si Android le demande. Ouvrez sPing et accordez-lui
            « Accès aux notifications » (voir le guide si l'interrupteur est grisé).

            **Sur le PC** : téléchargez `sping-setup.exe` et lancez-le. L'application n'est pas
            signée : si Windows affiche « Windows a protégé votre ordinateur », cliquez sur
            « Informations complémentaires » puis « Exécuter quand même ». Au premier lancement,
            autorisez sPing sur les réseaux privés quand le pare-feu le demande.

            `sping-windows.zip` est la version portable : décompressez-la et lancez `sping.exe`.
